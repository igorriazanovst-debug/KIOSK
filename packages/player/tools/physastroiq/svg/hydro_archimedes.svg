  <text x="800" y="1000" text-anchor="middle" fill="#e8eef4" font-size="27" font-family="system-ui, 'Segoe UI', sans-serif" font-weight="700">Архимедова сила:  FА = ρж · g · V</text>
  <text x="800" y="1036" text-anchor="middle" fill="#9fb3c4" font-size="19" font-family="system-ui, 'Segoe UI', sans-serif">V — объём ПОГРУЖЁННОЙ части тела; от плотности самого тела сила не зависит</text>
  <text x="800" y="178" text-anchor="middle" fill="#9fb3c4" font-size="21" font-family="system-ui, 'Segoe UI', sans-serif">Три тела одинакового объёма, но разной плотности: выталкивающая сила у них одна и та же</text>
  <text x="800" y="208" text-anchor="middle" fill="#9fb3c4" font-size="19" font-family="system-ui, 'Segoe UI', sans-serif">различается только вес — он и решает, всплывёт тело или утонет</text>
