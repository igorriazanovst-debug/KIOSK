  <text x="800" y="920" text-anchor="middle" fill="#e8eef4" font-size="27" font-family="system-ui, 'Segoe UI', sans-serif" font-weight="700">Условие равновесия рычага:  F₁ · l₁ = F₂ · l₂</text>
